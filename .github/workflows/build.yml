name: Release build and Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - run: python tools/test.py --host-only
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-host-checked
          path: |
            build/patcher-unsigned.apk
            build/payloaddex/classes.dex
  android-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python tools/android_smoke.py --apk artifacts/InstaPro-Patcher-release.apk --serial emulator-5554 --out build/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-startup-evidence
          path: build/android-smoke/
  publish:
    needs: [build, android-startup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/instapro-patcher-release-candidate'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS.txt)
          if gh release view v0.1.2-diagnostic1 > /dev/null 2>&1; then
            gh release upload v0.1.2-diagnostic1 artifacts/InstaPro-Patcher-release.apk artifacts/SHA256SUMS.txt docs/RELEASE_ARTIFACT.json docs/TEST_REPORT_TR.md --clobber
            gh release edit v0.1.2-diagnostic1 --draft=false --prerelease --notes-file docs/RELEASE_NOTES.md
          else
            gh release create v0.1.2-diagnostic1 artifacts/InstaPro-Patcher-release.apk artifacts/SHA256SUMS.txt docs/RELEASE_ARTIFACT.json docs/TEST_REPORT_TR.md --target "$GITHUB_SHA" --prerelease --title "v0.1.2 diagnostic — local startup error reporting" --notes-file docs/RELEASE_NOTES.md
          fi
